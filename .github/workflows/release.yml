name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: wails build
        run: wails build -platform windows/amd64 -ldflags "-s -w"

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash build/bin/cwdgo.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  cwdgo.exe" | Out-File -FilePath build/bin/cwdgo.exe.sha256 -Encoding ascii
          Get-Content build/bin/cwdgo.exe.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: cwdgo ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            build/bin/cwdgo.exe
            build/bin/cwdgo.exe.sha256
