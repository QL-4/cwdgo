name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # main.go embeds frontend/dist, which is gitignored and only exists
      # after a frontend build. Without this, go vet/test cannot compile.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) {
            Write-Host "These files are not gofmt'd:"
            Write-Host $bad
            exit 1
          }

      - name: go test
        run: go test ./...

  build:
    name: Build (wails)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: wails build
        run: wails build -platform windows/amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cwdgo-windows-amd64
          path: build/bin/cwdgo.exe
          if-no-files-found: error
